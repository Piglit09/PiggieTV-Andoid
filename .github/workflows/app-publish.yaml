name: App / Public beta candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact PTV version from gradle.properties (for example, 0.2.68)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-beta-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify signed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Public Beta
    env:
      PIGGIETV_VERSION: ${{ inputs.version }}
      SIGNING_CERTIFICATE_SHA256: ${{ secrets.SIGNING_CERTIFICATE_SHA256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: Validate beta inputs
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $required = @('KEYSTORE', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing public-beta signing variables: $($missing -join ', ')."
          }

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_SHA256)) {
            throw 'Missing public-beta certificate fingerprint variable: SIGNING_CERTIFICATE_SHA256.'
          }

          $configuredVersion = (Get-Content gradle.properties | Where-Object { $_ -match '^piggietv\.version=' }).Split('=', 2)[1].Trim()
          if ($env:PIGGIETV_VERSION -ne $configuredVersion) {
            throw "Requested version does not match gradle.properties."
          }
      - name: Run release gates and build signed candidates
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:verifyPublicBetaRelease --console=plain --no-daemon
      - name: Verify identity, signatures, and hashes
        shell: pwsh
        run: ./scripts/verify-public-beta-artifacts.ps1 -Version $env:PIGGIETV_VERSION
      - name: Upload private candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piggietv-android-v${{ inputs.version }}-public-beta-candidate
          retention-days: 14
          if-no-files-found: error
          path: build/public-beta/
